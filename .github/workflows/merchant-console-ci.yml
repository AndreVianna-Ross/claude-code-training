name: Merchant Console CI

on:
  pull_request:
    paths:
      - "build-battle/merchant-console/**"
      - ".github/workflows/merchant-console-ci.yml"
  push:
    branches-ignore: [main]
    paths:
      - "build-battle/merchant-console/**"
      - ".github/workflows/merchant-console-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: build-battle/merchant-console

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: build-battle/merchant-console/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint
      - name: Unit tests
        run: npm test
